<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 style="text-align: center;">Weather App</h1>
    <br>
    <br>
    <div class="search-container">
        <input type="text" placeholder="Enter city name..." class="search-input" style="font-family: 'Pacifico', 'Brush Script MT', 'Comic Sans MS', cursive;">
        <button onclick="handleSearch()">Search</button>
    </div>

    <div class="current-weather">
        <div class="weather-info">
            <h1 style="font-family: cursive, comic sans ms;">New York</h1>
            <p class="temperature">72°F</p>
            <p class="condition">Partly Cloudy</p>
        </div>
        <div class="weather-icon">⛅</div>
    </div>

    <div class="forecast">
        <div class="forecast-card">
            <p class="day">Monday</p>
            <p class="icon">☀️</p>
            <p class="temp">75°F</p>
        </div>
        
        <div class="forecast-card">
            <p class="day">Tuesday</p>
            <p class="icon">⛅</p>
            <p class="temp">72°F</p>
        </div>
        
        <div class="forecast-card">
            <p class="day">Wednesday</p>
            <p class="icon">🌧️</p>
            <p class="temp">65°F</p>
        </div>
        
        <div class="forecast-card">
            <p class="day">Thursday</p>
            <p class="icon">⛈️</p>
            <p class="temp">60°F</p>
        </div>
        
        <div class="forecast-card">
            <p class="day">Friday</p>
            <p class="icon">☀️</p>
            <p class="temp">78°F</p>
        </div>
    </div>

    <script>
        const API_KEY = "1ef55a1b4cba61f3bef60c02fd098515";
        
        function handleSearch() {
            const input = document.querySelector(".search-input");
            const city = input.value;
            
            if (city === "") {
                alert("Please enter a city name");
                return;
            }
            
            getWeather(city);
            getForecast(city);
        }
        
        function getWeather(city) {
            const url = "https://api.openweathermap.org/data/2.5/weather?q=" + city + "&appid=" + API_KEY + "&units=imperial";
            
            fetch(url)
                .then(response => response.json())
                .then(data => updateWeatherDisplay(data))
                .catch(error => {
                    alert("City not found");
                });
        }
        
        function updateWeatherDisplay(data) {
            const cityName = data.name;
            const temperature = Math.round(data.main.temp);
            const condition = data.weather[0].main;
            
            let emoji = "🌤️";
            
            if (condition.includes("Cloud")) {
                emoji = "⛅";
            } else if (condition.includes("Clear") || condition.includes("Sunny")) {
                emoji = "☀️";
            } else if (condition.includes("Rain")) {
                emoji = "🌧️";
            } else if (condition.includes("Storm")) {
                emoji = "⛈️";
            } else if (condition.includes("Snow")) {
                emoji = "❄️";
            }
            
            document.querySelector(".current-weather h1").textContent = cityName;
            document.querySelector(".temperature").textContent = temperature + "°F";
            document.querySelector(".condition").textContent = condition;
            document.querySelector(".weather-icon").textContent = emoji;
        }
        
        function getForecast(city) {
            const url = "https://api.openweathermap.org/data/2.5/forecast?q=" + city + "&appid=" + API_KEY + "&units=imperial";
            
            fetch(url)
                .then(response => response.json())
                .then(data => updateForecastDisplay(data))
                .catch(error => {
                    console.log("Forecast error:", error);
                });
        }
        
        function updateForecastDisplay(data) {
            const forecastList = data.list;
            const forecastCards = document.querySelectorAll(".forecast-card");
            
            const dailyForecasts = [
                forecastList[8],
                forecastList[16],
                forecastList[24],
                forecastList[32],
                forecastList[40]
            ];
            
            dailyForecasts.forEach((forecast, index) => {
                if (forecast && forecastCards[index]) {
                    const date = new Date(forecast.dt * 1000);
                    const dayName = date.toLocaleDateString('en-US', { weekday: 'long' });
                    const temp = Math.round(forecast.main.temp);
                    const condition = forecast.weather[0].main;
                    
                    let emoji = "🌤️";
                    if (condition.includes("Cloud")) {
                        emoji = "⛅";
                    } else if (condition.includes("Clear") || condition.includes("Sunny")) {
                        emoji = "☀️";
                    } else if (condition.includes("Rain")) {
                        emoji = "🌧️";
                    } else if (condition.includes("Storm")) {
                        emoji = "⛈️";
                    } else if (condition.includes("Snow")) {
                        emoji = "❄️";
                    }
                    
                    forecastCards[index].querySelector(".day").textContent = dayName;
                    forecastCards[index].querySelector(".icon").textContent = emoji;
                    forecastCards[index].querySelector(".temp").textContent = temp + "°F";
                }
            });
            
            console.log("Forecast updated!");
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const input = document.querySelector(".search-input");
            if (input) {
                input.addEventListener("keypress", function(event) {
                    if (event.key === "Enter") {
                        handleSearch();
                    }
                });
            }
        });
    </script>
    <footer class="footer" style = "text-align: center; font-family: Arial, Helvetica, sans-serif">
        <br><br><br>
        <pre><i><b>© 2026</b>: Created by Shlok Page</i></pre>
        <br>
    </footer>
</body>
</html>
