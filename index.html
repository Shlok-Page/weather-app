<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClimaCast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="data.js"></script>
    <h1 style="text-align: center;">ClimaCast</h1>
    <br>
    <br>
    <div class="search-container">
        <input type="text" placeholder="Enter city name..." class="search-input" style="font-family: 'Pacifico', 'Brush Script MT', 'Comic Sans MS', cursive;">
        <button onclick="handleSearch()">Search</button>
    </div>

    <div class="current-weather">
        <div class="weather-info">
            <h1 style="font-family: Arial, sans-serif;">New York</h1>
            <p class="temperature">72°F</p>
            <p class="condition">Partly Cloudy</p>
        </div>
        <div class="weather-icon">⛅</div>
    </div>

    <div class="forecast">
        <div class="forecast-card" style ="font-family: 'Courier New', Courier, monospace;">
            <p class="day">Monday</p>
            <p class="icon">☀️</p>
            <p class="temp">75°F</p>
        </div>
        
        <div class="forecast-card">
            <p class="day">Tuesday</p>
            <p class="icon">⛅</p>
            <p class="temp">72°F</p>
        </div>
        
        <div class="forecast-card">
            <p class="day">Wednesday</p>
            <p class="icon">🌧️</p>
            <p class="temp">65°F</p>
        </div>
        
        <div class="forecast-card">
            <p class="day">Thursday</p>
            <p class="icon">⛈️</p>
            <p class="temp">60°F</p>
        </div>
        
        <div class="forecast-card">
            <p class="day">Friday</p>
            <p class="icon">☀️</p>
            <p class="temp">78°F</p>
        </div>
    </div>
    <footer class="footer" style = "text-align: center; font-family: Arial, Helvetica, sans-serif">
        <br><br><br>
        <pre><i><b>© 2026</b>: Created by Shlok Page</i></pre>
        <br>
    </footer>
</body>
</html>
